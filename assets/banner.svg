<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" role="img" aria-label="Jorge Posada">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ee787">
        <animate attributeName="stop-color"
          values="#7ee787;#79c0ff;#d2a8ff;#ffa657;#7ee787"
          dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#79c0ff">
        <animate attributeName="stop-color"
          values="#79c0ff;#d2a8ff;#ffa657;#7ee787;#79c0ff"
          dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .grid { stroke: #21262d; stroke-width: 1; }
      .name {
        font: 700 64px 'Courier New', monospace;
        fill: url(#nameGrad);
        filter: url(#glow);
      }
      .prompt {
        font: 600 18px 'Courier New', monospace;
        fill: #7ee787;
      }
      .caret {
        font: 700 64px 'Courier New', monospace;
        fill: #c9d1d9;
        animation: blink 1s steps(2) infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }
      .scan {
        fill: none;
        stroke: #7ee787;
        stroke-width: 1;
        opacity: 0.25;
      }
    </style>
  </defs>

  <rect width="800" height="180" fill="url(#bgGrad)"/>

  <g class="grid">
    <path d="M0 30 H800 M0 60 H800 M0 90 H800 M0 120 H800 M0 150 H800"/>
    <path d="M100 0 V180 M200 0 V180 M300 0 V180 M400 0 V180 M500 0 V180 M600 0 V180 M700 0 V180"/>
  </g>

  <line class="scan" x1="0" x2="800" y1="0" y2="0">
    <animate attributeName="y1" values="0;180;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="0;180;0" dur="6s" repeatCount="indefinite"/>
  </line>

  <text x="40" y="50" class="prompt">~/jipg $ whoami</text>

  <text x="40" y="125" class="name">Jorge Posada</text>
  <text x="495" y="125" class="caret">_</text>
</svg>
