<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-label="Catch the Bug — pipeline game">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="50%" stop-color="#388bfd"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <radialGradient id="bugBody" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff7b72"/>
      <stop offset="100%" stop-color="#7d1f1a"/>
    </radialGradient>
    <radialGradient id="cageGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ee787" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7ee787" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .title { font: 700 22px 'Courier New', monospace; fill: #c9d1d9; }
      .sub   { font: 600 12px 'Courier New', monospace; fill: #8b949e; }
      .lbl   { font: 700 13px 'Courier New', monospace; fill: #0d1117; }
      .stage { font: 700 14px 'Courier New', monospace; fill: #7ee787; }
      .cmd   { font: 700 11px 'Courier New', monospace; }
      .term  { font: 600 13px 'Courier New', monospace; fill: #c9d1d9; }
      .termP { font: 700 13px 'Courier New', monospace; fill: #7ee787; }
      .score { font: 700 13px 'Courier New', monospace; fill: #ffa657; }
      .build { font: 700 12px 'Courier New', monospace; }
      .win   { font: 800 26px 'Courier New', monospace; fill: #7ee787; opacity: 0; }

      /* Master cycle = 18s. All animations share this duration. */

      /* ===== BUG TRAJECTORY ===== */
      .bug {
        animation: bugRun 18s ease-in-out infinite;
        transform-origin: center;
        filter: url(#glow2);
      }
      @keyframes bugRun {
        0%   { transform: translate(90px, 250px) rotate(0deg);  opacity: 0; }
        3%   { transform: translate(90px, 250px) rotate(0deg);  opacity: 1; }   /* spawn */
        15%  { transform: translate(220px, 250px) rotate(0deg); opacity: 1; }   /* walk to staging */
        22%  { transform: translate(330px, 250px) rotate(0deg); opacity: 1; }   /* reaches staging */
        28%  { transform: translate(210px, 250px) rotate(-15deg); opacity: 1; } /* reset pushes back */
        38%  { transform: translate(360px, 250px) rotate(0deg); opacity: 1; }   /* commit nudges forward */
        50%  { transform: translate(540px, 250px) rotate(0deg); opacity: 1; }   /* push */
        58%  { transform: translate(560px, 250px) rotate(20deg); opacity: 1; }  /* rebase tilts */
        62%  { transform: translate(560px, 250px) rotate(0deg); opacity: 1; }
        70%  { transform: translate(560px, 250px) rotate(360deg); opacity: 1; } /* net swoops */
        80%  { transform: translate(770px, 282px) rotate(720deg); opacity: 1; } /* carried to cage */
        88%  { transform: translate(770px, 282px) rotate(720deg); opacity: 1; } /* caged */
        96%  { transform: translate(770px, 282px) rotate(720deg); opacity: 0; } /* fade */
        100% { transform: translate(90px, 250px) rotate(0deg); opacity: 0; }    /* reset for next loop */
      }

      .legs { animation: wiggle 0.25s linear infinite; transform-origin: center; }
      @keyframes wiggle { 50% { transform: scaleX(-1); } }

      /* ===== COMMAND CARDS ===== */
      .cmd-reset   { animation: cReset   18s linear infinite; opacity: 0; transform-origin: center; }
      .cmd-commit  { animation: cCommit  18s linear infinite; opacity: 0; transform-origin: center; }
      .cmd-push    { animation: cPush    18s linear infinite; opacity: 0; transform-origin: center; }
      .cmd-rebase  { animation: cRebase  18s linear infinite; opacity: 0; transform-origin: center; }
      .cmd-revert  { animation: cRevert  18s linear infinite; opacity: 0; transform-origin: center; }

      @keyframes cReset {
        0%, 22%   { opacity: 0; transform: translateY(0); }
        25%       { opacity: 1; transform: translateY(-6px) scale(1.1); }
        30%       { opacity: 1; transform: translateY(0)    scale(1); }
        33%, 100% { opacity: 0; }
      }
      @keyframes cCommit {
        0%, 33%   { opacity: 0; transform: translateY(0); }
        36%       { opacity: 1; transform: translateY(-6px) scale(1.1); }
        42%       { opacity: 1; transform: translateY(0)    scale(1); }
        46%, 100% { opacity: 0; }
      }
      @keyframes cPush {
        0%, 46%   { opacity: 0; transform: translateY(0); }
        49%       { opacity: 1; transform: translateY(-6px) scale(1.1); }
        55%       { opacity: 1; transform: translateY(0)    scale(1); }
        58%, 100% { opacity: 0; }
      }
      @keyframes cRebase {
        0%, 56%   { opacity: 0; transform: translateY(0); }
        58%       { opacity: 1; transform: translateY(-6px) scale(1.1); }
        62%       { opacity: 1; transform: translateY(0)    scale(1); }
        66%, 100% { opacity: 0; }
      }
      @keyframes cRevert {
        0%, 65%   { opacity: 0; transform: translateY(0); }
        68%       { opacity: 1; transform: translateY(-6px) scale(1.1); }
        72%       { opacity: 1; transform: translateY(0)    scale(1); }
        76%, 100% { opacity: 0; }
      }

      /* ===== NET ===== */
      .net {
        animation: netCatch 18s ease-in-out infinite;
        opacity: 0;
      }
      @keyframes netCatch {
        0%, 66%   { opacity: 0; transform: translate(0, -250px) rotate(0deg); }
        70%       { opacity: 1; transform: translate(0, -40px)  rotate(15deg); }
        74%       { opacity: 1; transform: translate(0, 10px)   rotate(0deg); }
        80%       { opacity: 1; transform: translate(200px, 40px) rotate(-10deg); }
        84%       { opacity: 0; transform: translate(200px, 40px) rotate(-10deg); }
        100%      { opacity: 0; }
      }

      /* ===== CAGE DOOR ===== */
      .cage-door {
        animation: closeDoor 18s ease-in-out infinite;
        transform-origin: 770px 282px;
      }
      @keyframes closeDoor {
        0%, 78%   { transform: rotate(-80deg); }
        82%       { transform: rotate(0deg); }
        96%       { transform: rotate(0deg); }
        100%      { transform: rotate(-80deg); }
      }

      /* ===== CAGE GLOW ===== */
      .cage-glow {
        animation: cageGlowAnim 18s linear infinite;
        opacity: 0;
        transform-origin: center;
      }
      @keyframes cageGlowAnim {
        0%, 82% { opacity: 0; transform: scale(0.6); }
        86%     { opacity: 1; transform: scale(1.4); }
        94%     { opacity: 0.4; transform: scale(1); }
        100%    { opacity: 0; }
      }

      /* ===== WIN BANNER ===== */
      .win { animation: winFlash 18s linear infinite; }
      @keyframes winFlash {
        0%, 84%   { opacity: 0; transform: scale(0.6); }
        88%       { opacity: 1; transform: scale(1.1); }
        92%       { opacity: 1; transform: scale(1); }
        96%, 100% { opacity: 0; transform: scale(1); }
      }

      /* ===== SCORE INCREMENT ===== */
      .score-num { animation: scoreUp 18s steps(1) infinite; }
      @keyframes scoreUp {
        0%, 88% { opacity: 1; }
        88.01%  { opacity: 0; }
        88.5%   { opacity: 1; }
      }
      .score-old { animation: scoreOld 18s steps(1) infinite; opacity: 1; }
      @keyframes scoreOld {
        0%, 88%   { opacity: 1; }
        88.01%, 100% { opacity: 0; }
      }
      .score-new { animation: scoreNew 18s steps(1) infinite; opacity: 0; }
      @keyframes scoreNew {
        0%, 88%      { opacity: 0; }
        88.01%, 100% { opacity: 1; }
      }

      /* ===== BUILD STATUS LIGHT ===== */
      .build-fail { animation: buildFail 18s linear infinite; }
      @keyframes buildFail {
        0%, 76%      { fill: #ff7b72; }
        82%, 100%    { fill: #7ee787; }
      }
      .build-text-fail { animation: buildTxtFail 18s steps(1) infinite; }
      @keyframes buildTxtFail {
        0%, 76%      { opacity: 1; }
        76.01%, 100% { opacity: 0; }
      }
      .build-text-ok { animation: buildTxtOk 18s steps(1) infinite; opacity: 0; }
      @keyframes buildTxtOk {
        0%, 76%      { opacity: 0; }
        76.01%, 100% { opacity: 1; }
      }

      /* ===== TERMINAL LINES (rotating prompt text) ===== */
      .term-1, .term-2, .term-3, .term-4, .term-5, .term-6 { opacity: 0; }
      .term-1 { animation: t1 18s steps(1) infinite; }
      .term-2 { animation: t2 18s steps(1) infinite; }
      .term-3 { animation: t3 18s steps(1) infinite; }
      .term-4 { animation: t4 18s steps(1) infinite; }
      .term-5 { animation: t5 18s steps(1) infinite; }
      .term-6 { animation: t6 18s steps(1) infinite; }
      @keyframes t1 { 0%,16% { opacity: 1; } 16.01%,100% { opacity: 0; } }
      @keyframes t2 { 0%,22% { opacity: 0; } 22.01%,33% { opacity: 1; } 33.01%,100% { opacity: 0; } }
      @keyframes t3 { 0%,33% { opacity: 0; } 33.01%,46% { opacity: 1; } 46.01%,100% { opacity: 0; } }
      @keyframes t4 { 0%,46% { opacity: 0; } 46.01%,58% { opacity: 1; } 58.01%,100% { opacity: 0; } }
      @keyframes t5 { 0%,58% { opacity: 0; } 58.01%,76% { opacity: 1; } 76.01%,100% { opacity: 0; } }
      @keyframes t6 { 0%,76% { opacity: 0; } 76.01%,96% { opacity: 1; } 96.01%,100% { opacity: 0; } }

      /* Terminal cursor blink */
      .cursor { animation: cur 0.7s steps(2) infinite; }
      @keyframes cur { 50% { opacity: 0; } }

      /* Pipeline subtle pulse */
      .pulse { animation: pipePulse 2.4s ease-in-out infinite; }
      @keyframes pipePulse { 50% { opacity: 0.7; } }

      /* Commit graph: dots appear over time */
      .commit-dot { opacity: 0; }
      .cd1 { animation: cd 18s linear infinite; animation-delay: 1s; }
      .cd2 { animation: cd 18s linear infinite; animation-delay: 4s; }
      .cd3 { animation: cd 18s linear infinite; animation-delay: 7s; }
      .cd4 { animation: cd 18s linear infinite; animation-delay: 10s; }
      .cd5 { animation: cd 18s linear infinite; animation-delay: 13s; }
      @keyframes cd { 0% { opacity: 0; } 5% { opacity: 1; } 100% { opacity: 1; } }

      /* Sparkles around cage on capture */
      .spark { animation: sparkle 18s linear infinite; opacity: 0; }
      @keyframes sparkle {
        0%, 80%  { opacity: 0; transform: scale(0); }
        84%      { opacity: 1; transform: scale(1.6); }
        90%      { opacity: 0; transform: scale(0.5); }
        100%     { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="460" fill="url(#bg)"/>

  <!-- ── Header ── -->
  <text x="20" y="30" class="title">🐛 catch_the_bug.sh</text>
  <text x="20" y="50" class="sub">// route the bug through CI/CD into the cage — pipeline commands in motion</text>

  <!-- Score (top-right) -->
  <g class="score-num">
    <rect x="740" y="14" width="140" height="26" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="752" y="32" class="score">BUGS_CAUGHT:</text>
    <text x="858" y="32" class="score score-old" text-anchor="end">001</text>
    <text x="858" y="32" class="score score-new" text-anchor="end">002</text>
  </g>

  <!-- Build status -->
  <g>
    <circle cx="640" cy="27" r="6" class="build-fail"/>
    <text x="654" y="32" class="build build-text-fail" fill="#ff7b72">build: failing</text>
    <text x="654" y="32" class="build build-text-ok"   fill="#7ee787">build: passing</text>
  </g>

  <!-- ── Pipeline track ── -->
  <g class="pulse">
    <rect x="70" y="277" width="730" height="6" rx="3" fill="url(#pipe)"/>
    <circle cx="90"  cy="280" r="7" fill="#388bfd"/>
    <circle cx="330" cy="280" r="7" fill="#388bfd"/>
    <circle cx="560" cy="280" r="7" fill="#388bfd"/>
    <circle cx="780" cy="280" r="7" fill="#388bfd"/>
  </g>

  <!-- Stage labels -->
  <text x="90"  y="320" class="stage" text-anchor="middle">dev</text>
  <text x="330" y="320" class="stage" text-anchor="middle">staging</text>
  <text x="560" y="320" class="stage" text-anchor="middle">prod</text>
  <text x="780" y="320" class="stage" text-anchor="middle">🔒 cage</text>

  <!-- Cage glow (appears on capture) -->
  <ellipse cx="770" cy="282" rx="50" ry="50" fill="url(#cageGlow)" class="cage-glow"/>

  <!-- ── Command cards ── -->
  <g class="cmd-reset" transform="translate(220,180)">
    <rect x="-42" y="0" width="84" height="28" rx="6" fill="#da3633"/>
    <text x="0" y="19" class="cmd lbl" text-anchor="middle">git reset</text>
    <polygon points="0,30 -6,38 6,38" fill="#da3633"/>
  </g>
  <g class="cmd-commit" transform="translate(360,180)">
    <rect x="-47" y="0" width="94" height="28" rx="6" fill="#238636"/>
    <text x="0" y="19" class="cmd lbl" text-anchor="middle">git commit</text>
    <polygon points="0,30 -6,38 6,38" fill="#238636"/>
  </g>
  <g class="cmd-push" transform="translate(500,180)">
    <rect x="-42" y="0" width="84" height="28" rx="6" fill="#a371f7"/>
    <text x="0" y="19" class="cmd lbl" text-anchor="middle">git push</text>
    <polygon points="0,30 -6,38 6,38" fill="#a371f7"/>
  </g>
  <g class="cmd-rebase" transform="translate(580,180)">
    <rect x="-46" y="0" width="92" height="28" rx="6" fill="#ffa657"/>
    <text x="0" y="19" class="cmd lbl" text-anchor="middle">git rebase</text>
    <polygon points="0,30 -6,38 6,38" fill="#ffa657"/>
  </g>
  <g class="cmd-revert" transform="translate(660,180)">
    <rect x="-44" y="0" width="88" height="28" rx="6" fill="#79c0ff"/>
    <text x="0" y="19" class="cmd lbl" text-anchor="middle">git revert</text>
    <polygon points="0,30 -6,38 6,38" fill="#79c0ff"/>
  </g>

  <!-- ── Net (swoops down at capture time) ── -->
  <g class="net">
    <g transform="translate(560,230)">
      <line x1="0" y1="0" x2="0" y2="-50" stroke="#8b949e" stroke-width="3"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="#d2a8ff" stroke-width="2.5"/>
      <path d="M -18 -16 L 18 16 M -18 0 L 18 0 M -18 16 L 18 -16 M 0 -24 L 0 24"
        stroke="#d2a8ff" stroke-width="1" opacity="0.6"/>
    </g>
  </g>

  <!-- ── The Bug ── -->
  <g class="bug">
    <g class="legs">
      <line x1="-12" y1="-2" x2="-22" y2="-10" stroke="#c9d1d9" stroke-width="2"/>
      <line x1="-12" y1="2"  x2="-22" y2="10"  stroke="#c9d1d9" stroke-width="2"/>
      <line x1="12"  y1="-2" x2="22"  y2="-10" stroke="#c9d1d9" stroke-width="2"/>
      <line x1="12"  y1="2"  x2="22"  y2="10"  stroke="#c9d1d9" stroke-width="2"/>
    </g>
    <ellipse cx="0" cy="0" rx="14" ry="11" fill="url(#bugBody)" stroke="#0d1117" stroke-width="1.5"/>
    <line x1="0" y1="-11" x2="0" y2="11" stroke="#0d1117" stroke-width="1.5"/>
    <circle cx="-4" cy="-4" r="2" fill="#f0f6fc"/>
    <circle cx="4"  cy="-4" r="2" fill="#f0f6fc"/>
    <line x1="-5" y1="-12" x2="-8" y2="-18" stroke="#c9d1d9" stroke-width="1.5"/>
    <line x1="5"  y1="-12" x2="8"  y2="-18" stroke="#c9d1d9" stroke-width="1.5"/>
  </g>

  <!-- ── Cage ── -->
  <g transform="translate(770,250)">
    <rect x="-30" y="20" width="60" height="50" fill="#161b22" stroke="#8b949e" stroke-width="2" rx="3"/>
    <line x1="-20" y1="20" x2="-20" y2="70" stroke="#8b949e" stroke-width="1.5"/>
    <line x1="-10" y1="20" x2="-10" y2="70" stroke="#8b949e" stroke-width="1.5"/>
    <line x1="0"   y1="20" x2="0"   y2="70" stroke="#8b949e" stroke-width="1.5"/>
    <line x1="10"  y1="20" x2="10"  y2="70" stroke="#8b949e" stroke-width="1.5"/>
    <line x1="20"  y1="20" x2="20"  y2="70" stroke="#8b949e" stroke-width="1.5"/>
    <rect x="-34" y="14" width="68" height="8" fill="#30363d" rx="2"/>
  </g>
  <g class="cage-door">
    <rect x="740" y="270" width="3" height="50" fill="#8b949e"/>
  </g>

  <!-- Sparkles on capture -->
  <g class="spark">
    <circle cx="760" cy="270" r="3" fill="#7ee787"/>
    <circle cx="790" cy="278" r="2" fill="#79c0ff"/>
    <circle cx="775" cy="255" r="2.5" fill="#d2a8ff"/>
    <circle cx="800" cy="265" r="2" fill="#ffa657"/>
    <circle cx="750" cy="290" r="2" fill="#7ee787"/>
    <circle cx="785" cy="305" r="2.5" fill="#d2a8ff"/>
  </g>

  <!-- ── Commit graph (bottom-left, small visualization) ── -->
  <g transform="translate(40,360)">
    <text x="0" y="-6" class="sub">git log:</text>
    <line x1="10" y1="10" x2="160" y2="10" stroke="#30363d" stroke-width="2"/>
    <circle cx="20"  cy="10" r="5" class="commit-dot cd1" fill="#7ee787"/>
    <circle cx="50"  cy="10" r="5" class="commit-dot cd2" fill="#ff7b72"/>
    <circle cx="80"  cy="10" r="5" class="commit-dot cd3" fill="#7ee787"/>
    <circle cx="110" cy="10" r="5" class="commit-dot cd4" fill="#a371f7"/>
    <circle cx="140" cy="10" r="5" class="commit-dot cd5" fill="#ffa657"/>
  </g>

  <!-- ── Terminal panel (bottom) ── -->
  <g transform="translate(220,355)">
    <rect x="0" y="0" width="640" height="80" rx="6" fill="#161b22" stroke="#30363d"/>
    <circle cx="14" cy="14" r="4" fill="#ff5f56"/>
    <circle cx="28" cy="14" r="4" fill="#ffbd2e"/>
    <circle cx="42" cy="14" r="4" fill="#27c93f"/>
    <text x="60" y="18" class="sub">~/jipg/pipeline</text>

    <!-- rotating terminal lines -->
    <g transform="translate(16,45)">
      <text class="term-1"><tspan class="termP">$</tspan> <tspan class="term">deploy --target=prod</tspan></text>
      <text class="term-2"><tspan class="termP">!</tspan> <tspan class="term" fill="#ff7b72">bug detected in staging, rolling back...</tspan></text>
      <text class="term-3"><tspan class="termP">$</tspan> <tspan class="term">git commit -m "fix: trap the bug"</tspan></text>
      <text class="term-4"><tspan class="termP">$</tspan> <tspan class="term">git push origin main</tspan></text>
      <text class="term-5"><tspan class="termP">~</tspan> <tspan class="term" fill="#ffa657">rebasing onto containment branch...</tspan></text>
      <text class="term-6"><tspan class="termP">$</tspan> <tspan class="term" fill="#7ee787">bug captured — quarantine confirmed ✓</tspan></text>
    </g>
    <text x="16" y="68" class="term">
      <tspan fill="#8b949e">→ </tspan><tspan class="cursor" fill="#7ee787">▊</tspan>
    </text>
  </g>

  <!-- ── Win banner ── -->
  <text x="450" y="160" class="win" text-anchor="middle">✓ BUG CAPTURED — production is safe</text>
</svg>
