<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 664" role="img" aria-label="Risk-Driven Development, QA and Observability working together">
  <defs>
    <linearGradient id="ig-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>
    <radialGradient id="ig-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <filter id="ig-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .h1   { font: 800 24px 'Segoe UI', Arial, sans-serif; fill: #e6edf3; }
      .h2   { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #8b949e; }
      .sec  { font: 700 13px 'Courier New', monospace; fill: #8b949e; letter-spacing: 1px; }
      .node-t { font: 700 12px 'Segoe UI', Arial, sans-serif; }
      .node-s { font: 600 9.5px 'Segoe UI', Arial, sans-serif; fill: #8b949e; }
      .core-t { font: 800 15px 'Segoe UI', Arial, sans-serif; fill: #e6edf3; }
      .core-s { font: 600 10px 'Courier New', monospace; fill: #58a6ff; }
      .q-num  { font: 800 13px 'Courier New', monospace; }
      .q-txt  { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #e6edf3; }
      .q-dim  { font: 600 11px 'Segoe UI', Arial, sans-serif; fill: #8b949e; }
      .eq     { font: 800 20px 'Courier New', monospace; fill: #e6edf3; }
      .eq-s   { font: 800 20px 'Courier New', monospace; }
      .eq-cap { font: 700 9px 'Courier New', monospace; }
      .role-t { font: 800 13px 'Segoe UI', Arial, sans-serif; }
      .role-s { font: 600 9.5px 'Segoe UI', Arial, sans-serif; fill: #8b949e; }
      .fb     { font: italic 600 9.5px 'Segoe UI', Arial, sans-serif; fill: #8b949e; }
      .tag    { font: 800 8px 'Courier New', monospace; }

      /* ---- Cycle ring flow ---- */
      .ring-flow {
        stroke-dasharray: 14 10;
        animation: ringDash 1.6s linear infinite;
      }
      @keyframes ringDash { to { stroke-dashoffset: -48; } }

      /* ---- Node glow windows (12s loop, 6 stages) ---- */
      .nglow { opacity: 0; }
      .ng-plan { animation: g1 12s ease-in-out infinite; }
      .ng-risk { animation: g2 12s ease-in-out infinite; }
      .ng-obs1 { animation: g3 12s ease-in-out infinite; }
      .ng-impl { animation: g4 12s ease-in-out infinite; }
      .ng-val  { animation: g5 12s ease-in-out infinite; }
      .ng-mon  { animation: g6 12s ease-in-out infinite; }
      @keyframes g1 { 0%,16% {opacity:1;} 22%,94% {opacity:0;} 100%{opacity:1;} }
      @keyframes g2 { 0%,11% {opacity:0;} 17%,33% {opacity:1;} 39%,100% {opacity:0;} }
      @keyframes g3 { 0%,28% {opacity:0;} 33%,50% {opacity:1;} 56%,100% {opacity:0;} }
      @keyframes g4 { 0%,44% {opacity:0;} 50%,66% {opacity:1;} 72%,100% {opacity:0;} }
      @keyframes g5 { 0%,61% {opacity:0;} 67%,83% {opacity:1;} 89%,100% {opacity:0;} }
      @keyframes g6 { 0%,78% {opacity:0;} 84%,100% {opacity:1;} }

      /* ---- 4 questions highlight (synced: risk phase ~ q1-2, val ~ q3, obs/mon ~ q4) ---- */
      .qbar { opacity: 0.12; }
      .qb1 { animation: q1 12s ease-in-out infinite; }
      .qb2 { animation: q2 12s ease-in-out infinite; }
      .qb3 { animation: q3 12s ease-in-out infinite; }
      .qb4 { animation: q4 12s ease-in-out infinite; }
      @keyframes q1 { 0%,17% {opacity:0.12;} 22%,30% {opacity:1;} 36%,100% {opacity:0.12;} }
      @keyframes q2 { 0%,24% {opacity:0.12;} 29%,37% {opacity:1;} 43%,100% {opacity:0.12;} }
      @keyframes q3 { 0%,61% {opacity:0.12;} 67%,83% {opacity:1;} 89%,100% {opacity:0.12;} }
      @keyframes q4 { 0%,33% {opacity:0.12;} 39%,56% {opacity:1;} 62%,78%{opacity:0.12;} 84%,100%{opacity:1;} }

      /* ---- Equation term pulses ---- */
      .pulse-o { animation: pO 12s ease-in-out infinite; }
      @keyframes pO { 0%,61% {opacity:0.55;} 67%,83% {opacity:1;} 89%,100% {opacity:0.55;} }
      .pulse-d { animation: pD 12s ease-in-out infinite; }
      @keyframes pD { 0%,33% {opacity:0.55;} 39%,56% {opacity:1;} 62%,78%{opacity:0.55;} 84%,100%{opacity:1;} }

      .link-o { animation: pO 12s ease-in-out infinite; stroke-dasharray: 5 4; }
      .link-d { animation: pD 12s ease-in-out infinite; stroke-dasharray: 5 4; }

      /* ---- Footer flow + feedback ---- */
      .flow { stroke-dasharray: 8 6; animation: flowDash 1.4s linear infinite; }
      @keyframes flowDash { to { stroke-dashoffset: -28; } }
      .fb-arrow { stroke-dasharray: 6 5; animation: fbDash 1.8s linear infinite; }
      @keyframes fbDash { to { stroke-dashoffset: -44; } }

      .breathe { animation: br 4s ease-in-out infinite; }
      @keyframes br { 50% { opacity: 0.6; } }
    </style>
  </defs>

  <rect width="940" height="664" fill="url(#ig-bg)"/>

  <!-- ───────── Header ───────── -->
  <text x="40" y="44" class="h1">Risk-Driven Development <tspan fill="#8b949e">×</tspan> QA <tspan fill="#8b949e">×</tspan> Observability</text>
  <text x="40" y="66" class="h2">One development cycle — three reinforcing disciplines. Prioritize by risk, not by uniform coverage.</text>
  <line x1="40" y1="80" x2="900" y2="80" stroke="#21262d" stroke-width="1"/>

  <!-- ═════════ LEFT: the RDD cycle ═════════ -->
  <text x="40" y="112" class="sec">// THE CYCLE</text>

  <!-- core glow + ring -->
  <circle cx="250" cy="350" r="150" fill="url(#ig-core)"/>
  <circle cx="250" cy="350" r="140" fill="none" stroke="#21262d" stroke-width="10"/>
  <circle cx="250" cy="350" r="140" fill="none" stroke="#1f6feb" stroke-width="2.5" class="ring-flow" opacity="0.7"/>

  <!-- traveling dot -->
  <circle r="8" fill="#e6edf3" filter="url(#ig-glow)">
    <animateMotion dur="12s" repeatCount="indefinite"
      path="M250,210 A140,140 0 0 1 250,490 A140,140 0 0 1 250,210"/>
  </circle>

  <!-- center label -->
  <text x="250" y="345" class="core-t" text-anchor="middle">RISK-DRIVEN</text>
  <text x="250" y="366" class="core-s" text-anchor="middle">RPN = S × O × D</text>

  <!-- Nodes (clockwise from top): Plan, Analyze risk, Design obs, Implement, Validate, Monitor -->
  <!-- Plan (top) #58a6ff -->
  <g>
    <circle cx="250" cy="210" r="34" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <circle class="nglow ng-plan" cx="250" cy="210" r="34" fill="#58a6ff" opacity="0" filter="url(#ig-glow)"/>
    <circle cx="250" cy="210" r="34" fill="none" stroke="#58a6ff" stroke-width="2"/>
    <text x="250" y="207" class="node-t" fill="#58a6ff" text-anchor="middle">Plan</text>
    <text x="250" y="219" class="node-s" text-anchor="middle">feature</text>
  </g>
  <!-- Analyze risk (upper right) #ffa657 RDD -->
  <g>
    <circle cx="371" cy="280" r="34" fill="#0d1117" stroke="#ffa657" stroke-width="2"/>
    <circle class="nglow ng-risk" cx="371" cy="280" r="34" fill="#ffa657" opacity="0" filter="url(#ig-glow)"/>
    <circle cx="371" cy="280" r="34" fill="none" stroke="#ffa657" stroke-width="2"/>
    <text x="371" y="277" class="node-t" fill="#ffa657" text-anchor="middle">Analyze</text>
    <text x="371" y="289" class="node-s" text-anchor="middle">risk · FMEA</text>
  </g>
  <!-- Design observability (lower right) #f778ba SRE -->
  <g>
    <circle cx="371" cy="420" r="34" fill="#0d1117" stroke="#f778ba" stroke-width="2"/>
    <circle class="nglow ng-obs1" cx="371" cy="420" r="34" fill="#f778ba" opacity="0" filter="url(#ig-glow)"/>
    <circle cx="371" cy="420" r="34" fill="none" stroke="#f778ba" stroke-width="2"/>
    <text x="371" y="417" class="node-t" fill="#f778ba" text-anchor="middle">Design</text>
    <text x="371" y="429" class="node-s" text-anchor="middle">observability</text>
  </g>
  <!-- Implement (bottom) #3fb950 DevOps -->
  <g>
    <circle cx="250" cy="490" r="34" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <circle class="nglow ng-impl" cx="250" cy="490" r="34" fill="#3fb950" opacity="0" filter="url(#ig-glow)"/>
    <circle cx="250" cy="490" r="34" fill="none" stroke="#3fb950" stroke-width="2"/>
    <text x="250" y="494" class="node-t" fill="#3fb950" text-anchor="middle">Implement</text>
  </g>
  <!-- Validate (lower left) #e3b341 QA -->
  <g>
    <circle cx="129" cy="420" r="34" fill="#0d1117" stroke="#e3b341" stroke-width="2"/>
    <circle class="nglow ng-val" cx="129" cy="420" r="34" fill="#e3b341" opacity="0" filter="url(#ig-glow)"/>
    <circle cx="129" cy="420" r="34" fill="none" stroke="#e3b341" stroke-width="2"/>
    <text x="129" y="417" class="node-t" fill="#e3b341" text-anchor="middle">Validate</text>
    <text x="129" y="429" class="node-s" text-anchor="middle">QA gates</text>
  </g>
  <!-- Monitor (upper left) #f778ba SRE -->
  <g>
    <circle cx="129" cy="280" r="34" fill="#0d1117" stroke="#f778ba" stroke-width="2"/>
    <circle class="nglow ng-mon" cx="129" cy="280" r="34" fill="#f778ba" opacity="0" filter="url(#ig-glow)"/>
    <circle cx="129" cy="280" r="34" fill="none" stroke="#f778ba" stroke-width="2"/>
    <text x="129" y="284" class="node-t" fill="#f778ba" text-anchor="middle">Monitor</text>
  </g>

  <!-- ═════════ RIGHT TOP: the 4 FMEA questions ═════════ -->
  <text x="490" y="112" class="sec">// THE 4 RISK QUESTIONS (FMEA)</text>

  <!-- Q1 -->
  <g transform="translate(490,124)">
    <rect class="qbar qb1" x="0" y="0" width="410" height="40" rx="6" fill="#ffa657"/>
    <rect x="0" y="0" width="410" height="40" rx="6" fill="none" stroke="#21262d"/>
    <rect x="0" y="0" width="4" height="40" rx="2" fill="#ffa657"/>
    <text x="16" y="18" class="q-num" fill="#ffa657">1.</text>
    <text x="34" y="18" class="q-txt">What can fail?</text>
    <text x="34" y="33" class="q-dim">Failure mode — APIs, migrations, saturation, idempotency</text>
  </g>
  <!-- Q2 -->
  <g transform="translate(490,170)">
    <rect class="qbar qb2" x="0" y="0" width="410" height="40" rx="6" fill="#b22222"/>
    <rect x="0" y="0" width="410" height="40" rx="6" fill="none" stroke="#21262d"/>
    <rect x="0" y="0" width="4" height="40" rx="2" fill="#ff7b72"/>
    <text x="16" y="18" class="q-num" fill="#ff7b72">2.</text>
    <text x="34" y="18" class="q-txt">How serious if it fails? <tspan class="tag" fill="#ff7b72">SEVERITY (S)</tspan></text>
    <text x="34" y="33" class="q-dim">Business impact → drives feature flag / canary / rollback</text>
  </g>
  <!-- Q3 -->
  <g transform="translate(490,216)">
    <rect class="qbar qb3" x="0" y="0" width="410" height="40" rx="6" fill="#e3b341"/>
    <rect x="0" y="0" width="410" height="40" rx="6" fill="none" stroke="#21262d"/>
    <rect x="0" y="0" width="4" height="40" rx="2" fill="#e3b341"/>
    <text x="16" y="18" class="q-num" fill="#e3b341">3.</text>
    <text x="34" y="18" class="q-txt">How likely to fail? <tspan class="tag" fill="#e3b341">OCCURRENCE (O)</tspan></text>
    <text x="34" y="33" class="q-dim">↓ lowered by QA — tests &amp; contracts catch it before prod</text>
  </g>
  <!-- Q4 -->
  <g transform="translate(490,262)">
    <rect class="qbar qb4" x="0" y="0" width="410" height="40" rx="6" fill="#f778ba"/>
    <rect x="0" y="0" width="410" height="40" rx="6" fill="none" stroke="#21262d"/>
    <rect x="0" y="0" width="4" height="40" rx="2" fill="#f778ba"/>
    <text x="16" y="18" class="q-num" fill="#f778ba">4.</text>
    <text x="34" y="18" class="q-txt">Would we detect it in time? <tspan class="tag" fill="#f778ba">DETECTION (D)</tspan></text>
    <text x="34" y="33" class="q-dim">↓ lowered by Observability — metrics, alerts, traces, logs</text>
  </g>

  <!-- ═════════ RIGHT BOTTOM: the RPN equation ═════════ -->
  <g transform="translate(490,326)">
    <rect x="0" y="0" width="410" height="150" rx="10" fill="#0d1117" stroke="#30363d"/>
    <text x="20" y="26" class="sec">// HOW THEY MULTIPLY EACH OTHER</text>

    <!-- equation -->
    <text x="20" y="74" class="eq">RPN =</text>
    <text x="118" y="74" class="eq-s" fill="#ff7b72">S</text>
    <text x="140" y="74" class="eq" fill="#8b949e">×</text>
    <text x="166" y="74" class="eq-s pulse-o" fill="#e3b341">O</text>
    <text x="188" y="74" class="eq" fill="#8b949e">×</text>
    <text x="214" y="74" class="eq-s pulse-d" fill="#f778ba">D</text>

    <text x="118" y="92" class="eq-cap" fill="#ff7b72" text-anchor="middle">severity</text>
    <text x="166" y="92" class="eq-cap" fill="#e3b341" text-anchor="middle">occurrence</text>
    <text x="214" y="92" class="eq-cap" fill="#f778ba" text-anchor="middle">detection</text>

    <!-- contributor chips -->
    <g transform="translate(255,52)">
      <rect x="0" y="0" width="135" height="22" rx="11" fill="#e3b34122" stroke="#e3b341"/>
      <line class="link-o" x1="-89" y1="11" x2="2" y2="11" stroke="#e3b341" stroke-width="1.5"/>
      <text x="67" y="15" class="role-t" fill="#e3b341" text-anchor="middle">QA  ↓ O</text>
    </g>
    <g transform="translate(255,80)">
      <rect x="0" y="0" width="135" height="22" rx="11" fill="#f778ba22" stroke="#f778ba"/>
      <line class="link-d" x1="-41" y1="11" x2="2" y2="11" stroke="#f778ba" stroke-width="1.5"/>
      <text x="67" y="15" class="role-t" fill="#f778ba" text-anchor="middle">Observability  ↓ D</text>
    </g>

    <line x1="20" y1="112" x2="390" y2="112" stroke="#21262d"/>
    <text x="20" y="132" class="q-dim" fill="#c9d1d9"><tspan fill="#ffa657" font-weight="700">RDD</tspan> spends the QA &amp; observability budget where RPN is highest —</text>
    <text x="20" y="146" class="q-dim" fill="#c9d1d9">instrument what hurts most, not everything uniformly.</text>
  </g>

  <!-- ═════════ FOOTER: three-role synergy flow ═════════ -->
  <line x1="40" y1="520" x2="900" y2="520" stroke="#21262d" stroke-width="1"/>
  <text x="40" y="548" class="sec">// THE THREE FEED INTO EACH OTHER</text>

  <g transform="translate(40,560)">
    <!-- DevOps -->
    <rect x="0" y="0" width="250" height="50" rx="8" fill="#3fb95015" stroke="#3fb950"/>
    <circle cx="22" cy="25" r="6" fill="#3fb950" class="breathe"/>
    <text x="40" y="22" class="role-t" fill="#3fb950">DevOps</text>
    <text x="40" y="38" class="role-s">Reliable pipeline — safe, repeatable change</text>

    <!-- arrow -->
    <line class="flow" x1="256" y1="25" x2="296" y2="25" stroke="#8b949e" stroke-width="2"/>
    <polygon points="296,20 306,25 296,30" fill="#8b949e"/>

    <!-- QA -->
    <rect x="312" y="0" width="250" height="50" rx="8" fill="#e3b34115" stroke="#e3b341"/>
    <circle cx="334" cy="25" r="6" fill="#e3b341" class="breathe"/>
    <text x="352" y="22" class="role-t" fill="#e3b341">QA</text>
    <text x="352" y="38" class="role-s">Automated validation — confidence, ↓ Occurrence</text>

    <!-- arrow -->
    <line class="flow" x1="568" y1="25" x2="608" y2="25" stroke="#8b949e" stroke-width="2"/>
    <polygon points="608,20 618,25 608,30" fill="#8b949e"/>

    <!-- SRE -->
    <rect x="624" y="0" width="236" height="50" rx="8" fill="#f778ba15" stroke="#f778ba"/>
    <circle cx="646" cy="25" r="6" fill="#f778ba" class="breathe"/>
    <text x="664" y="22" class="role-t" fill="#f778ba">SRE</text>
    <text x="664" y="38" class="role-s">Observability — visibility, ↓ Detection</text>
  </g>

  <!-- feedback loop SRE -> DevOps -->
  <path class="fb-arrow" d="M 856 624 C 880 650, 60 650, 56 626" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <polygon points="51,620 56,631 63,622" fill="#58a6ff"/>
  <text x="470" y="652" class="fb" text-anchor="middle">feedback loop — postmortems &amp; incidents refine the next cycle</text>
</svg>
